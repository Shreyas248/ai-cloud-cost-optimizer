spring.application.name=ai-cloud-cost-optimizer

server.port=8080

# PostgreSQL
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/cloud_optimizer}
# spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/cloud_optimizer}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# File Upload Configuration

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

app.upload.directory=uploads

# Ollama
spring.ai.ollama.base-url=http://localhost:11434

spring.ai.ollama.chat.options.model=llama3.2:3b

spring.ai.ollama.embedding.options.model=nomic-embed-text:latest

# Qdrant
qdrant.host=localhost
qdrant.port=6334
qdrant.collection=cloud_documents
# ==========================================
# JWT CONFIGURATION
# ==========================================

jwt.secret=cloudoptimizer-super-secret-jwt-key-change-this-in-production-2026-very-secure

jwt.expiration=86400000